<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Spending Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .chart-container {
            position: relative;
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }

        #chart {
            width: 100%;
            height: 300px;
            display: block;
        }

        .starting-balance {
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .day-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .day-name {
            font-weight: 600;
            color: #333;
            min-width: 100px;
        }

        .spending-input {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .spending-input label {
            color: #666;
            font-size: 14px;
        }

        .spending-input input {
            width: 120px;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .spending-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background: #c82333;
        }

        .save-indicator {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .sync-status {
            text-align: center;
            margin-top: 10px;
            color: #28a745;
            font-size: 12px;
            min-height: 16px;
        }

        @media (max-width: 600px) {
            .day-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .day-name {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weekly Spending Tracker</h1>

        <div class="chart-container">
            <canvas id="chart" width="700" height="300"></canvas>
        </div>

        <div class="starting-balance" id="startingBalanceLabel"></div>

        <div id="dayInputs">
            <div class="day-row">
                <div class="day-name">Monday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Monday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Tuesday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Tuesday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Wednesday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Wednesday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Thursday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Thursday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Friday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Friday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Saturday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Saturday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
            <div class="day-row">
                <div class="day-name">Sunday</div>
                <div class="spending-input">
                    <label>Spending:</label>
                    <input type="number" id="Sunday" min="0" step="0.01" value="" placeholder="0.00">
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetAll()">Reset All</button>

        <div class="save-indicator">&#9729;&#65039; Data synced across all your devices</div>
        <div class="sync-status" id="syncStatus"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // ============================================================
        // SETTINGS - change the weekly maximum here in ONE place.
        // Everything (starting balance, chart axis, scaling) uses this.
        // ============================================================
        const WEEKLY_MAX = 1000;   // weekly starting balance / chart maximum
        const AXIS_STEP  = 200;    // spacing between Y-axis labels

        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const dayAbbr = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        let database, spendingRef;
        let isUpdating = false;   // guards against the Firebase echo while we write

        // ---- Firebase setup -------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCGb__-mR1cx6aNL6jx7-r3gNmYWUfbmtE",
            authDomain: "spending-tracker-32d19.firebaseapp.com",
            databaseURL: "https://spending-tracker-32d19-default-rtdb.firebaseio.com",
            projectId: "spending-tracker-32d19",
            storageBucket: "spending-tracker-32d19.firebasestorage.app",
            messagingSenderId: "380249343428",
            appId: "1:380249343428:web:11c40f5ea5085638c45091"
        };

        function initFirebase() {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                spendingRef = database.ref('spending');

                // Whenever the cloud data changes (from this or any other device),
                // mirror it into the inputs. If data is null (a reset), clear them.
                spendingRef.on('value', function (snapshot) {
                    if (isUpdating) return;
                    const data = snapshot.val();
                    days.forEach(function (day) {
                        const input = document.getElementById(day);
                        if (!input) return;
                        input.value = (data && data[day] != null) ? data[day] : '';
                    });
                    drawChart();
                });
            } else {
                setTimeout(initFirebase, 100);
            }
        }
        initFirebase();

        // ---- Saving ---------------------------------------------------------
        function saveData(day, value) {
            if (!spendingRef) return;
            isUpdating = true;
            spendingRef.child(day).set(value)
                .then(function () {
                    isUpdating = false;
                    showSyncStatus('Saved \u2713');
                })
                .catch(function (error) {
                    isUpdating = false;
                    showSyncStatus('Error saving');
                    console.error('Error saving:', error);
                });
        }

        function showSyncStatus(message) {
            const status = document.getElementById('syncStatus');
            if (!status) return;
            status.textContent = message;
            setTimeout(function () { status.textContent = ''; }, 2000);
        }

        // ---- Chart ----------------------------------------------------------
        function drawChart() {
            const canvas = document.getElementById('chart');
            if (!canvas || !canvas.getContext) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const padding = 50;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;
            const divisions = Math.round(WEEKLY_MAX / AXIS_STEP);

            ctx.clearRect(0, 0, width, height);

            // Running balance for each day
            const balances = [];
            let currentBalance = WEEKLY_MAX;
            days.forEach(function (day) {
                balances.push(currentBalance);
                const input = document.getElementById(day);
                const daySpending = input ? (parseFloat(input.value) || 0) : 0;
                currentBalance -= daySpending;
            });

            // Grid lines
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= divisions; i++) {
                const y = padding + (chartHeight / divisions) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }

            // Y-axis labels
            ctx.fillStyle = '#666';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let i = 0; i <= divisions; i++) {
                const value = WEEKLY_MAX - (i * AXIS_STEP);
                const y = padding + (chartHeight / divisions) * i;
                ctx.fillText('$' + value, padding - 10, y);
            }

            // X-axis labels
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            dayAbbr.forEach(function (day, i) {
                const x = padding + (chartWidth / 6) * i;
                ctx.fillText(day, x, height - padding + 10);
            });

            // Line
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            balances.forEach(function (balance, i) {
                const x = padding + (chartWidth / 6) * i;
                const y = padding + chartHeight - (balance / WEEKLY_MAX) * chartHeight;
                if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
            });
            ctx.stroke();

            // Dots
            ctx.fillStyle = '#667eea';
            balances.forEach(function (balance, i) {
                const x = padding + (chartWidth / 6) * i;
                const y = padding + chartHeight - (balance / WEEKLY_MAX) * chartHeight;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            // Balance labels above each point
            ctx.fillStyle = '#333';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            balances.forEach(function (balance, i) {
                const x = padding + (chartWidth / 6) * i;
                const y = padding + chartHeight - (balance / WEEKLY_MAX) * chartHeight;
                ctx.fillText('$' + balance.toFixed(0), x, y - 12);
            });
        }

        // ---- Reset ----------------------------------------------------------
        function resetAll() {
            if (!confirm('Are you sure you want to reset all spending data? This will clear data on all devices.')) {
                return;
            }

            // Clear locally right away so the screen responds instantly.
            days.forEach(function (day) {
                const input = document.getElementById(day);
                if (input) input.value = '';
            });
            drawChart();

            // Clear the cloud copy. Guard the echo so the listener doesn't fight us.
            if (spendingRef) {
                isUpdating = true;
                spendingRef.remove()
                    .then(function () {
                        isUpdating = false;
                        showSyncStatus('All data cleared \u2713');
                    })
                    .catch(function (error) {
                        isUpdating = false;
                        showSyncStatus('Error: ' + error.message);
                        console.error('Error clearing data:', error);
                    });
            } else {
                showSyncStatus('All data cleared \u2713');
            }
        }

        // ---- Startup --------------------------------------------------------
        function init() {
            document.getElementById('startingBalanceLabel').textContent =
                'Starting Balance: $' + WEEKLY_MAX;

            days.forEach(function (day) {
                const input = document.getElementById(day);
                if (input) {
                    input.addEventListener('input', function (e) {
                        saveData(day, e.target.value);
                        drawChart();
                    });
                }
            });

            drawChart();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.addEventListener('resize', drawChart);
    </script>
</body>
</html>
